[package]
name = "procd"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
description = "Lightweight process supervisor for containers with a Unix-socket JSON-RPC API"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
nix = { version = "0.31.3", features = ["signal", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "net", "io-util", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = "1.1.8+spec-1.1.0"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
